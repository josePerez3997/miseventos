<div class="container mt-4">
    <div class="page-header">
      <h1>My Profile</h1>
      <p>This page is protected by the AuthGuard - only authenticated users can see it.</p>
    </div>
    
    <div class="profile-content" *ngIf="user">
      <div class="profile-section">
        <h2>User Information</h2>
        <div class="user-data">
          <div class="data-row">
            <span class="label">Name:</span>
            <span class="value">{{ user.name }}</span>
          </div>
          <div class="data-row">
            <span class="label">Email:</span>
            <span class="value">{{ user.email }}</span>
          </div>
          <div class="data-row">
            <span class="label">User ID:</span>
            <span class="value">{{ user.id }}</span>
          </div>
        </div>
      </div>
      
      <div class="placeholder-content">
        <p>The complete profile management functionality will be implemented in a future commit.</p>
      </div>
    </div>
</div>
